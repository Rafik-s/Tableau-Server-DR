name: Enterprise Tableau DR Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tableau-dr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Static Validation and Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install CI dependencies
        run: |
          python -m pip install pytest pytest-cov

      - name: Validate installed dependencies
        run: |
          python -m pip check

      - name: Validate Python syntax
        run: |
          python -m compileall -q tableau_dr execute_switchover.py

      - name: Run test suite with coverage
        run: |
          python -m pytest \
            --cov=tableau_dr \
            --cov-report=term-missing \
            --cov-report=xml \
            tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: ignore