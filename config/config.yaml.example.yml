# Tableau Server DR - Example Configuration
# -------------------------------------------------------------------
# This file is a TEMPLATE only.
# DO NOT place passwords, secrets, tokens, private keys, or certificates
# in this file.
#
# Copy this file to config.yaml and populate environment-specific values.
# -------------------------------------------------------------------

environment:
  version: "2025.x"
  name: "production"

azure:
  # Azure Key Vault containing DR security material.
  key_vault_name: "YOUR_KEY_VAULT_NAME"

  # Azure Storage Account used for DR backup persistence.
  storage_account_name: "YOUR_STORAGE_ACCOUNT_NAME"

  # Blob container used for Tableau DR backups.
  storage_container: "tableau-dr-backups"

  # Azure SDK retry configuration.
  max_retries: 3
  retry_initial_backoff_seconds: 2

servers:
  production:
    hostname: "YOUR_PRODUCTION_TABLEAU_HOSTNAME"
    identity_store: "activedirectory"

  disaster_recovery:
    hostname: "YOUR_DR_TABLEAU_HOSTNAME"
    identity_store: "activedirectory"

paths:
  # Local staging directory used while creating and validating backups.
  backup_dir: "D:/TableauDR/backups"

  # Local working directory used during DR recovery.
  recovery_work_dir: "D:/TableauDR/recovery"

backup:
  # Minimum free disk space required before starting a backup.
  minimum_free_space_gb: 50

  # Minimum accepted Tableau repository backup size.
  minimum_backup_size_mb: 10

  # When true, downloaded Azure blobs are streamed and re-hashed
  # using SHA-256 after upload.
  verify_remote_content_sha256: false

tsm:
  # Optional.
  #
  # If omitted, TSMConnector resolves the executable in this order:
  #
  # 1. Constructor argument
  # 2. This YAML value
  # 3. TSM_EXECUTABLE environment variable
  # 4. OS default PATH lookup
  #
  # Windows example:
  # executable: "C:/Program Files/Tableau/Tableau Server/packages/bin.2025.1.0/tsm.cmd"
  #
  # Linux example:
  # executable: "/opt/tableau/tableau_server/packages/bin/tsm"

  executable: ""

security:
  # Keep security-related configuration here.
  # Do NOT store actual credentials or private keys in this file.

  # Secret names are identifiers only; the actual values remain in
  # Azure Key Vault.
  ssl_certificate_secret_name: "tableau-dr-ssl-cert"
  ssl_private_key_secret_name: "tableau-dr-ssl-key"