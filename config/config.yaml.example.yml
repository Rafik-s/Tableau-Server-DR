# Tableau Server DR - Example Configuration
# -------------------------------------------------------------------
# TEMPLATE ONLY
#
# DO NOT place passwords, secrets, tokens, private keys, certificates,
# or other sensitive credentials in this file.
#
# Copy this file to config.yaml and replace all environment-specific
# values before executing the DR framework.
# -------------------------------------------------------------------

environment:
  # Tableau Server version deployed in the environment.
  version: "2025.1.0"

azure:
  # Azure Key Vault containing DR security material.
  key_vault_name: "kv-tableau-dr-prod"

  # Azure Storage Account used for DR backup persistence.
  #
  # Must be 3-24 characters, lowercase letters and numbers only.
  storage_account_name: "sttableaudrprod"

  # Blob container used for Tableau DR backups.
  #
  # Must comply with Azure Blob Storage container naming rules.
  storage_container: "tableau-dr-backups"

  # Azure SDK retry configuration.
  max_retries: 3
  retry_backoff_factor: 0.8

servers:
  production:
    hostname: "tableau-prod.example.internal"
    identity_store: "activedirectory"

  disaster_recovery:
    hostname: "tableau-dr.example.internal"
    identity_store: "activedirectory"

paths:
  # Local staging directory used while creating and validating backups.
  backup_dir: "D:/TableauDR/backups"

  # Local working directory used during DR recovery.
  recovery_work_dir: "D:/TableauDR/recovery"

backup:
  # Minimum free disk space required before backup/recovery operations.
  minimum_free_space_gb: 50.0

  # Minimum accepted Tableau repository backup size.
  minimum_backup_size_mb: 10.0

  # When true, Azure blobs are streamed and re-hashed using SHA-256
  # during remote verification.
  #
  # Recommended for higher-assurance environments.
  verify_remote_content_sha256: false

tsm:
  # Optional.
  #
  # If omitted, TSMConnector resolves the executable using:
  #
  # 1. Explicit constructor argument
  # 2. This YAML value
  # 3. TSM_EXECUTABLE environment variable
  # 4. OS PATH lookup
  #
  # Windows example:
  # executable: "C:/Program Files/Tableau/Tableau Server/packages/bin.20251.0.0/tsm.cmd"
  #
  # Linux example:
  # executable: "/opt/tableau/tableau_server/packages/bin/tsm"
  #
  executable: ""

security:
  # Production fencing must be explicitly confirmed before recovery.
  #
  # Set these according to your organization's external fencing process.
  production_fencing_enabled: false
  production_fencing_confirmed: false

  # Emergency authorization is intended for exceptional situations
  # where normal production fencing confirmation is unavailable.
  #
  # NEVER store the real authorization code in this file.
  #
  # The actual secret should ultimately be retrieved from a secure
  # secret-management system such as Azure Key Vault.
  emergency_fencing_auth_code: "CHANGE_ME_IN_SECURE_VAULT"
  